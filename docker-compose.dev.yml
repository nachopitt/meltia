# =============================================================================
# DEVELOPMENT override — merged on top of docker-compose.yml.
#
# Activate it once by setting this in your .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
# Then every `docker compose ...` command uses dev automatically.
#
# This file only lists what is DIFFERENT in dev: local builds, live-reload
# bind mounts, exposed ports, and the dev-only workspace + vite helpers.
# Everything else (db, redis, network, volume) is inherited from the base.
# =============================================================================
services:
  # Build the dev image locally and mount the source for live changes
  app:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: dev
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    container_name: meltia-app-dev
    restart: no
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    command: ["/bin/bash", "/app/scripts/start.sh"]

  web:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: web
    container_name: meltia-web-dev
    restart: no
    volumes:
      - .:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8080}:80"

  db:
    container_name: meltia-db-dev
    restart: no
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    container_name: meltia-redis-dev
    restart: no
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # CLI container for node / npm / npx / medusa / vitest (dev only)
  workspace:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: workspace
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    container_name: meltia-workspace-dev
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - meltia
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["tail", "-f", "/dev/null"]

  # Vite dev server with hot module reload (dev only)
  vite:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: dev
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    container_name: meltia-vite-dev
    env_file:
      - .env
    environment:
      - MEDUSA_BACKEND_URL=http://app:9000
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://localhost:9000
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_e948efee71591f079be63002159c43bc8a560fdc738a3d0afa0cb3b3021d9361
    volumes:
      - .:/app
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - meltia
    depends_on:
      - app
    command: ["/bin/bash", "/app/scripts/start-storefront.sh"]

  # Dedicated Playwright multi-browser test container (Chromium, Firefox, WebKit)
  playwright:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    container_name: meltia-playwright-dev
    network_mode: "service:vite"
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app
    ipc: host
    tty: true
    entrypoint: ["tail", "-f", "/dev/null"]
