server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Medusa backend API & Admin Dashboard routes
    location ~ ^/(admin|store|auth|custom|health|app)(/|$) {
        set $backend "http://app:9000";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Frontend HMR WebSocket connection & assets (Next.js / Vite)
    location ~ ^/(_next|@vite|@fs|@id|node_modules|src)/ {
        set $storefront "http://vite:5173";
        proxy_pass $storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
    }

    # Frontend Storefront (Vite dev server)
    location / {
        set $storefront "http://vite:5173";
        proxy_pass $storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
